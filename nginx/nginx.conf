# LKM 生产反向代理统一入口
# 80:ACME http-01 challenge + 301 到 HTTPS;443:TLS 终止 + 分流
# 用 resolver(docker 内嵌 DNS)+ 变量形式 proxy_pass,使后端/前端域名在运行时动态解析:
# nginx 启动时不解析域名,避免启动期依赖 compose DNS;容器重启 IP 变化也能正确解析。
# 通用反代头抽到 proxy-common-headers.conf,经 include 复用。

resolver 127.0.0.11 valid=30s ipv6=off;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

server {
    listen 80;
    server_name lkm.s12mc.xyz;

    # ACME http-01 challenge 由 certbot webroot 写入 certbot_www 卷
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name lkm.s12mc.xyz;

    ssl_certificate     /etc/letsencrypt/live/lkm.s12mc.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lkm.s12mc.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    # 上游(backend/astro)不可用时的统一错误页,避免暴露 nginx 原生错误页
    error_page 502 503 504 = @maintenance;
    location @maintenance {
        default_type application/json;
        return 502 '{"code":502,"msg":"服务暂时不可用,请稍后重试","data":null}';
    }

    # 指纹静态资源:长缓存(内容不可变,指纹资源)
    location /_astro/ {
        set $astro_upstream astro:4321;
        proxy_pass http://$astro_upstream;
        include proxy-common-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # REST API → 后端
    location = /api {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        include proxy-common-headers.conf;
    }

    location ^~ /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        include proxy-common-headers.conf;
        # ^~ 阻断 regex;无斜杠 /api 由上面精确匹配处理,不落入 / 走 astro
    }

    # GraphQL → 后端,支持 WebSocket upgrade(subscription)
    location = /graphql {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include proxy-common-headers.conf;
    }

    location ^~ /graphql/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include proxy-common-headers.conf;
    }

    # 其余 → 前端 SSR
    location / {
        set $astro_upstream astro:4321;
        proxy_pass http://$astro_upstream;
        include proxy-common-headers.conf;
    }
}
