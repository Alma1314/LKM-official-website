[project]
name = "lkm-backend"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "strawberry-graphql[fastapi]>=0.279.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
