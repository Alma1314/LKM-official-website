services:
  astro:
    build: .
    ports:
      - '80:4321'
    environment:
      - NODE_ENV=production
      - API_URL=http://fastapi:8000
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - fastapi
    restart: unless-stopped

  fastapi:
    build: ./backend
    expose:
      - '8000'
    environment:
      - DATABASE_URL=postgresql://lkm:${DB_PASSWORD}@postgres:5432/lkm
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_DOMAIN=.lkm.app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=lkm
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=lkm
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lkm -d lkm']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  pgdata:
